# Baut die App und legt die fertige APK in apk/ ab (Bot-Commit).
# Danach: git pull, dann apk/karoo-fused-gps.apk per adb installieren.
name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "apk/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK bauen
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: karoo-fused-gps
          path: app/build/outputs/apk/release/*.apk

      - name: APK ins Repository legen
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/karoo-fused-gps.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/karoo-fused-gps.apk
          git commit -m "APK-Build fuer ${GITHUB_SHA::7} (automatisch)" || exit 0
          git push
